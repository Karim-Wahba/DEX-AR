# Tracked path defaults. Machine-specific values belong in paths.local.ini
# (gitignored, same format, wins over this file); an environment variable of the
# same name in upper case wins over both. Relative paths resolve against the
# repo root, and ~ is expanded.
#
#   cp paths.ini paths.local.ini    # then edit voc_root
#   python -m config                # show what resolved, and from where

[paths]
# PascalVOC 2012 devkit root: must hold ImageSets/, JPEGImages/, SegmentationClass/.
# Required by experiments/eval_masks.py and experiments/voc_nulls.py.
voc_root = <path to VOCdevkit/VOC2012>

# Where eval_masks.py writes metrics.txt and per_image.json, one directory per run.
results_root = results

# Slurm job output (slurm/*.sbatch writes logs/%x-%j.out).
logs_root = logs

# Cached activation tensors, if you use the probe scripts.
baselines_root = baselines

# Optional: HuggingFace model cache. Leave blank to use the HF default.
hf_cache =
